name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No dependencies and no network in the tests, so the matrix is free.
    # Running it proves the zero-dependency claim rather than asserting it.
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Pinned: an unpinned ruff turns CI red on untouched code the day the
      # formatter changes its mind. The sibling packages all pin it.
      - run: pip install "pytest>=8" "ruff>=0.16,<0.17"
      # research/ draws the paper's figures, so it is linted too: an unlinted
      # directory is where the next shadowed name goes to live.
      - run: ruff check src tests scripts research demo.py
      - run: ruff format --check src tests scripts research demo.py
      # The suite never touches NCBI: the reference genome is vendored at
      # tests/data. A test that needs a public API to be up is a test that
      # fails on someone else's outage.
      - run: pytest -q
      - run: python demo.py

  # The nearest-neighbour cross-check needs Biopython, and the matrix above must not have
  # it: a run that installs nothing is what proves the package has no runtime
  # dependencies. So the oracle gets a job of its own. Without this job the cross-check
  # would skip everywhere and the claim in section 4.6 would rest on a local run.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "pytest>=8" "biopython>=1.80"
      # Fail if the oracle is absent rather than skipping: a skipped cross-check in the
      # one job that exists to run it is a green tick for nothing.
      - run: python -c "import Bio; print(Bio.__version__)"
      - run: pytest -q tests/test_thermo.py --no-header -rs
      # And prove the oracle tests actually ran here, rather than skipping quietly.
      - run: pytest -q tests/test_thermo.py -k biopython --no-header | tee /tmp/oracle.txt
      - run: grep -qE "[0-9]+ passed" /tmp/oracle.txt && ! grep -q "skipped" /tmp/oracle.txt
