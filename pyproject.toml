[project]
name = "assay-drift"
version = "0.1.0"
description = "Do published PCR diagnostic assays still match what is circulating? Measured against GenBank."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639, as the sibling repositories use. The deprecated table form plus a
# "License ::" classifier is what setuptools and hatchling now warn about, and what
# newer PyPI metadata rejects.
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "bioinformatics", "pcr", "diagnostics", "primers", "genbank",
    "sars-cov-2", "sequence-analysis", "public-health",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# No dependencies. Everything here is urllib, re and the standard library -
# which matters for a tool meant to be auditable by people who care about the
# answer rather than about Python packaging.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]
# The nearest-neighbour cross-check in tests/test_thermo.py. Deliberately NOT in
# `dev`: the default test run must pass without it, because a matrix that installs
# nothing is what proves the "no runtime dependencies" claim rather than asserting
# it. The oracle tests skip when it is absent and one CI job installs it.
oracle = ["biopython>=1.80"]

[project.scripts]
assay-drift = "assaydrift.cli:main"

[project.urls]
Homepage = "https://github.com/hammasbuilds/assay-drift"
Issues = "https://github.com/hammasbuilds/assay-drift/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]
# Same oracle extra as above, for `uv sync --group oracle`.
oracle = ["biopython>=1.80"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assaydrift"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
