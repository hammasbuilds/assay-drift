[project]
name = "assay-drift"
version = "0.1.0"
description = "Do published PCR diagnostic assays still match what is circulating? Measured against GenBank."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "bioinformatics", "pcr", "diagnostics", "primers", "genbank",
    "sars-cov-2", "sequence-analysis", "public-health",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# No dependencies. Everything here is urllib, re and the standard library -
# which matters for a tool meant to be auditable by people who care about the
# answer rather than about Python packaging.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
assay-drift = "assaydrift.cli:main"

[project.urls]
Homepage = "https://github.com/hammasbuilds/assay-drift"
Issues = "https://github.com/hammasbuilds/assay-drift/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assaydrift"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
